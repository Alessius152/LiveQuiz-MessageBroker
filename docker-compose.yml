name: livequiz_message_broker

services:

    zookeeper: 
        image: confluentinc/cp-zookeeper:7.5.0
        container_name: livequiz_zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        healthcheck:
            test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Zookeeper version'"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
        networks: 
            - livequiz-messagebrokers-net

    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: livequiz_kafka
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        depends_on:
            zookeeper:
                condition: service_healthy
        networks:
            - livequiz-messagebrokers-net

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: livequiz_kafka_ui
        ports:
            - "9090:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        depends_on:
            - kafka
        networks:
            - livequiz-messagebrokers-net

networks:
    livequiz-messagebrokers-net:
        driver: bridge
        name: livequiz-messagebrokers-net